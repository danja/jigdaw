<!doctype html>
<!--
  plugins/octet/ui/index.html

  Octet's own editor: the plot a graphic equalizer has. Every band's curve and the total, drawn from the same
  coefficients the module uses; a numbered node per band to drag (across for frequency, up and down for gain); the
  wheel over the plot for Q; the spectrum analyser behind the curves; a strip to choose a band and the controls of the
  chosen one; and the stereo mode, the spectrum tap, the output level and the MIDI settings. Everything the plot does
  with a pointer the keyboard does too, and every control here is also on the host's generated panel.

  The host loads it into a sandboxed frame on the plugin's origin and talks to it only by postMessage (contract
  section 9, docs/messaging.md section 2). One file with its script inline, so the profile's jig:integrity digest covers
  everything that runs here.

  It renders from what the host says, never from its own input: a value it asks for may come back clamped, and
  messaging.md 2.3 requires the frame to show the value the host applied. Dragging a node sends requests; the node
  moves to whatever comes back. The spectrum arrives from the processor as `plugin` messages (messaging.md 2.4),
  64 levels in decibels about thirty times a second.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Octet</title>
<style>
  :root { color-scheme: dark; --fg:#e6e8eb; --dim:#9aa3ad; --accent:#c6843a; --panel:#1a1e24; --plot:#0e1116;
    --grid:#2a3038; --zero:#4a525c; --field:#22272f; --focus:#7fb3ff; }
  html { height:auto; }
  body { margin:0; padding:12px; background:var(--panel); color:var(--fg); font:16px/1.4 system-ui, sans-serif; }
  h1 { font-size:14px; margin:0; color:var(--dim); font-weight:600; letter-spacing:.04em; }
  .top { display:flex; align-items:center; gap:12px 24px; margin-bottom:10px; flex-wrap:wrap; }
  .top .group { display:flex; align-items:center; gap:8px; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  #plot { width:100%; height:300px; display:block; background:var(--plot); border:1px solid var(--grid);
    border-radius:6px; touch-action:none; cursor:crosshair; }
  #plot:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
  .bands { display:grid; grid-template-columns:repeat(8, 1fr); gap:6px; margin:10px 0; }
  .bands button { min-height:44px; border:1px solid var(--grid); border-radius:6px; background:var(--field);
    color:var(--fg); font-size:14px; cursor:pointer; padding:4px; }
  .bands button .n { display:block; font-weight:700; font-size:16px; }
  .bands button .t { display:block; color:var(--dim); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bands button[aria-pressed="true"] { border-color:var(--accent); outline:2px solid var(--accent); }
  .bands button.off .n { color:var(--dim); text-decoration:line-through; }
  .bands button.off .n::after { content:" (off)"; font-weight:400; font-size:12px; }
  fieldset { border:1px solid var(--grid); border-radius:6px; margin:0 0 10px; padding:10px 12px 12px; min-width:0; }
  legend { color:var(--dim); padding:0 6px; font-size:14px; }
  .row { display:grid; grid-template-columns:6.5rem 1fr 7rem; gap:10px; align-items:center; min-height:44px; }
  .row.plain { grid-template-columns:6.5rem 1fr; }
  .row[hidden] { display:none; }
  .row label, .row .name { color:var(--dim); }
  .row output { font-family:ui-monospace, monospace; text-align:right; font-size:14px; }
  .segments { display:flex; flex-wrap:wrap; border:1px solid var(--grid); border-radius:6px; overflow:hidden; width:max-content; max-width:100%; }
  .segments label { display:block; position:relative; }
  .segments input { position:absolute; opacity:0; inset:0; margin:0; cursor:pointer; }
  .segments span { display:block; min-height:44px; box-sizing:border-box; padding:10px 14px; background:var(--field);
    color:var(--fg); border-right:1px solid var(--grid); font-size:14px; line-height:24px; white-space:nowrap; }
  .segments label:last-child span { border-right:0; }
  .segments input:checked + span { background:var(--accent); color:#10131a; font-weight:700; }
  .segments input:focus-visible + span { outline:2px solid var(--focus); outline-offset:-3px; }
  input[type=range] { width:100%; min-width:0; height:44px; accent-color:var(--accent); }
  input[type=range]:focus-visible, input[type=number]:focus-visible, select:focus-visible,
    input[type=checkbox]:focus-visible, button:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
  input[type=number] { width:7rem; font-size:16px; background:var(--field); color:var(--fg);
    border:1px solid var(--grid); border-radius:4px; padding:8px; }
  select { font-size:16px; background:var(--field); color:var(--fg); border:1px solid var(--grid); border-radius:4px; padding:8px; max-width:100%; }
  input[type=checkbox] { width:24px; height:24px; accent-color:var(--accent); }
  .hint { color:var(--dim); font-size:13px; margin:6px 0 0; }
  .waiting { color:var(--dim); }
  @media (max-width: 720px) {
    .bands { grid-template-columns:repeat(4, 1fr); }
    .row, .row.plain { grid-template-columns:1fr; gap:2px; }
    .row output { text-align:left; }
    input[type=number] { width:100%; }
    #plot { height:240px; }
  }
</style>
</head>
<body>
<main id="root">
  <header class="top">
    <h1>Octet</h1>
  </header>
  <div id="stage"><p class="waiting">Waiting for the host.</p></div>
</main>
<script>
  'use strict'
  // The host's origin, learnt from its init. Until then nothing is sent but ready, which carries nothing, and nothing
  // received is trusted.
  let host = null

  const BANDS = 8
  // The port layout this editor is written for. Ranges and defaults repeat profile.json by hand, because the host's
  // init carries only symbol, name, minimum, maximum and default per port and no scale points
  // (src/rdf/ProfileJsonLd.js): the names below are this editor's own knowledge of its own plugin, and
  // tests/dsp/octet.test.js fails if they drift from the profile.
  const TYPE_NAMES = ['HP 12', 'HP 48', 'Low shelf', 'Bell', 'Notch', 'High shelf', 'LP 12', 'LP 48']
  const DEFAULT_TYPE = [1, 2, 3, 3, 3, 3, 5, 7]
  const DEFAULT_FREQ = [30, 100, 250, 600, 1500, 4000, 8000, 18000]
  const DEFAULT_ON = [0, 1, 1, 1, 1, 1, 1, 0]
  const FMIN = 20, FMAX = 20000
  const PLOT_DB = 24            // the plot runs +-24 dB; band gain stops at +-18
  const GAIN_MAX = 18
  const QMIN = 0.1, QMAX = 18
  const SPECTRUM_BINS = 64, SPECTRUM_FLOOR = -90
  const COLORS = ['#d66054', '#de9646', '#d6be50', '#84be60', '#50b4a0', '#5496d2', '#8c78d6', '#cc78ba']
  const ACCENT = '#c6843a'

  const values = { mode: 0, output: 0, cc_channel: 1, cc_band: 4, spectrum_source: 2 }
  for (let b = 1; b <= BANDS; b++) {
    values[`band${b}_on`] = DEFAULT_ON[b - 1]
    values[`band${b}_type`] = DEFAULT_TYPE[b - 1]
    values[`band${b}_freq`] = DEFAULT_FREQ[b - 1]
    values[`band${b}_gain`] = 0
    values[`band${b}_q`] = DEFAULT_TYPE[b - 1] === 2 || DEFAULT_TYPE[b - 1] === 5 ? 0.71 : 1
    values[`band${b}_channel`] = 0
  }
  let selected = 3
  // The display rate: until the processor says what it is running at, the curves are drawn for 48 kHz.
  let displayRate = 48000
  const spectrum = new Float32Array(SPECTRUM_BINS).fill(SPECTRUM_FLOOR)

  function send (message) {
    if (host) parent.postMessage(message, host)
  }
  function request (symbol, value) {
    send({ type: 'parameter', symbol, value })
  }

  // BEGIN response
  // The response of a band, from the coefficients the module uses (plugins/octet/octet.cpp, makeSections): an RBJ
  // cookbook cell with an explicit Q, one for a bell, shelf, notch or 12 dB cut and four for a 48 dB cut. A band is
  // { on, type, freq, gain, q }. tests/dsp/octet.test.js holds these to the module's own audio within 0.15 dB.
  const BELL = 3, LOW_SHELF = 2, HIGH_SHELF = 5, NOTCH = 4, HP12 = 0, HP48 = 1, LP12 = 6, LP48 = 7

  function usesGain (band) { const t = Math.round(band.type); return t === BELL || t === LOW_SHELF || t === HIGH_SHELF }
  function usesQ (band) { return usesGain(band) || Math.round(band.type) === NOTCH }
  function isActive (band) { return band.on >= 0.5 && (!usesGain(band) || Math.abs(band.gain) > 0.005) }

  function cell (type, f0, gainDb, q, sr) {
    const w0 = 2 * Math.PI * f0 / sr
    const cw = Math.cos(w0), sw = Math.sin(w0)
    const alpha = sw / (2 * q)
    const A = Math.pow(10, gainDb / 40)
    let b0, b1, b2, a0, a1, a2
    if (type === BELL) {
      b0 = 1 + alpha * A; b1 = -2 * cw; b2 = 1 - alpha * A
      a0 = 1 + alpha / A; a1 = -2 * cw; a2 = 1 - alpha / A
    } else if (type === LOW_SHELF) {
      const s = 2 * Math.sqrt(A) * alpha
      b0 = A * ((A + 1) - (A - 1) * cw + s); b1 = 2 * A * ((A - 1) - (A + 1) * cw); b2 = A * ((A + 1) - (A - 1) * cw - s)
      a0 = (A + 1) + (A - 1) * cw + s; a1 = -2 * ((A - 1) + (A + 1) * cw); a2 = (A + 1) + (A - 1) * cw - s
    } else if (type === HIGH_SHELF) {
      const s = 2 * Math.sqrt(A) * alpha
      b0 = A * ((A + 1) + (A - 1) * cw + s); b1 = -2 * A * ((A - 1) + (A + 1) * cw); b2 = A * ((A + 1) + (A - 1) * cw - s)
      a0 = (A + 1) - (A - 1) * cw + s; a1 = 2 * ((A - 1) - (A + 1) * cw); a2 = (A + 1) - (A - 1) * cw - s
    } else if (type === NOTCH) {
      b0 = 1; b1 = -2 * cw; b2 = 1
      a0 = 1 + alpha; a1 = -2 * cw; a2 = 1 - alpha
    } else if (type === HP12 || type === HP48) {
      b0 = (1 + cw) / 2; b1 = -(1 + cw); b2 = (1 + cw) / 2
      a0 = 1 + alpha; a1 = -2 * cw; a2 = 1 - alpha
    } else {
      b0 = (1 - cw) / 2; b1 = 1 - cw; b2 = (1 - cw) / 2
      a0 = 1 + alpha; a1 = -2 * cw; a2 = 1 - alpha
    }
    return [b0 / a0, b1 / a0, b2 / a0, a1 / a0, a2 / a0]
  }

  function sectionsFor (band, sr) {
    const f0 = Math.min(Math.max(band.freq, 20), Math.min(20000, sr * 0.49))
    const type = Math.round(band.type)
    if (type === HP48 || type === LP48) {
      // 8th-order Butterworth: Q = 1 / (2 cos((2k-1) pi / 16)), so the corner is 3 dB down.
      const sections = []
      for (let k = 1; k <= 4; k++) sections.push(cell(type, f0, 0, 1 / (2 * Math.cos((2 * k - 1) * Math.PI / 16)), sr))
      return sections
    }
    if (type === HP12 || type === LP12) return [cell(type, f0, 0, Math.SQRT1_2, sr)]
    return [cell(type, f0, band.gain, band.q, sr)]
  }

  function bandResponseDb (band, hz, sr) {
    if (!isActive(band)) return 0
    const w = 2 * Math.PI * Math.min(Math.max(hz, 1), sr * 0.499) / sr
    const cw = Math.cos(w), sw = Math.sin(w), c2 = Math.cos(2 * w), s2 = Math.sin(2 * w)
    let power = 1
    for (const [b0, b1, b2, a1, a2] of sectionsFor(band, sr)) {
      const nr = b0 + b1 * cw + b2 * c2, ni = -(b1 * sw + b2 * s2)
      const dr = 1 + a1 * cw + a2 * c2, di = -(a1 * sw + a2 * s2)
      power *= (nr * nr + ni * ni) / Math.max(1e-24, dr * dr + di * di)
    }
    return 10 * Math.log10(Math.max(power, 1e-18))
  }

  function totalResponseDb (bands, hz, sr) {
    let db = 0
    for (const band of bands) db += bandResponseDb(band, hz, sr)
    return db
  }
  // END response

  const band = b => ({
    on: values[`band${b}_on`], type: values[`band${b}_type`], freq: values[`band${b}_freq`],
    gain: values[`band${b}_gain`], q: values[`band${b}_q`], channel: values[`band${b}_channel`]
  })
  const allBands = () => Array.from({ length: BANDS }, (_, i) => band(i + 1))

  // --- the plot -------------------------------------------------------------------
  const M = { left: 38, right: 10, top: 10, bottom: 22 }
  let canvas, ctx, drawQueued = false

  const plotBox = () => {
    const w = canvas.clientWidth, h = canvas.clientHeight
    return { x: M.left, y: M.top, w: Math.max(10, w - M.left - M.right), h: Math.max(10, h - M.top - M.bottom) }
  }
  const xOf = (hz, p) => p.x + Math.log(Math.min(FMAX, Math.max(FMIN, hz)) / FMIN) / Math.log(FMAX / FMIN) * p.w
  const hzOf = (x, p) => FMIN * Math.pow(FMAX / FMIN, Math.min(1, Math.max(0, (x - p.x) / p.w)))
  const yOf = (db, p) => p.y + (PLOT_DB - Math.min(PLOT_DB, Math.max(-PLOT_DB, db))) / (2 * PLOT_DB) * p.h
  const dbOf = (y, p) => PLOT_DB - (y - p.y) / p.h * 2 * PLOT_DB
  const nodeY = (b, p) => yOf(usesGain(band(b)) ? values[`band${b}_gain`] : 0, p)

  function queueDraw () {
    if (drawQueued) return
    drawQueued = true
    requestAnimationFrame(() => { drawQueued = false; draw() })
  }

  function draw () {
    if (!canvas) return
    const ratio = window.devicePixelRatio || 1
    const w = canvas.clientWidth, h = canvas.clientHeight
    if (canvas.width !== Math.round(w * ratio) || canvas.height !== Math.round(h * ratio)) {
      canvas.width = Math.round(w * ratio)
      canvas.height = Math.round(h * ratio)
    }
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0)
    ctx.clearRect(0, 0, w, h)
    const css = getComputedStyle(document.documentElement)
    const grid = css.getPropertyValue('--grid').trim()
    const zero = css.getPropertyValue('--zero').trim()
    const dim = css.getPropertyValue('--dim').trim()
    const p = plotBox()

    ctx.font = '11px system-ui, sans-serif'
    ctx.lineWidth = 1
    // dB grid in 6 dB steps with the 0 dB line stronger, and labels each 12.
    for (let db = -PLOT_DB; db <= PLOT_DB; db += 6) {
      const y = yOf(db, p)
      ctx.strokeStyle = db === 0 ? zero : grid
      ctx.lineWidth = db === 0 ? 1.6 : 0.8
      ctx.beginPath(); ctx.moveTo(p.x, y); ctx.lineTo(p.x + p.w, y); ctx.stroke()
      if (db % 12 === 0) {
        ctx.fillStyle = dim; ctx.textAlign = 'right'; ctx.textBaseline = 'middle'
        ctx.fillText(`${db > 0 ? '+' : ''}${db}`, p.x - 6, y)
      }
    }
    ctx.lineWidth = 0.8
    ctx.textAlign = 'center'; ctx.textBaseline = 'top'
    for (const hz of [50, 100, 200, 500, 1000, 2000, 5000, 10000]) {
      const x = xOf(hz, p)
      ctx.strokeStyle = grid
      ctx.beginPath(); ctx.moveTo(x, p.y); ctx.lineTo(x, p.y + p.h); ctx.stroke()
      ctx.fillStyle = dim
      ctx.fillText(hz >= 1000 ? `${hz / 1000} k` : `${hz}`, x, p.y + p.h + 6)
    }
    ctx.strokeStyle = grid
    ctx.strokeRect(p.x, p.y, p.w, p.h)

    // The analyser: one bar per band from the floor, behind the curves. The bands are log spaced, so equal widths
    // match the frequency axis; the bars have their own scale, floor to full scale over the height of the plot.
    const source = Math.round(values.spectrum_source)
    if (source !== 0) {
      const barW = p.w / SPECTRUM_BINS
      ctx.fillStyle = source === 1 ? 'rgba(154,163,173,0.38)' : 'rgba(198,132,58,0.36)'
      for (let k = 0; k < SPECTRUM_BINS; k++) {
        const n = Math.min(1, Math.max(0, (spectrum[k] - SPECTRUM_FLOOR) / -SPECTRUM_FLOOR))
        if (n <= 0) continue
        const bh = n * p.h * 0.9
        ctx.fillRect(p.x + k * barW + 0.5, p.y + p.h - bh, barW - 1, bh)
      }
      ctx.fillStyle = dim; ctx.textAlign = 'right'; ctx.textBaseline = 'top'
      ctx.fillText(source === 1 ? 'spectrum: before the EQ' : 'spectrum: after the EQ', p.x + p.w - 6, p.y + 5)
    }

    const bands = allBands()
    const points = Math.max(60, Math.floor(p.w))
    const trace = (fn, style, width) => {
      ctx.strokeStyle = style
      ctx.lineWidth = width
      ctx.beginPath()
      let pen = false
      for (let k = 0; k <= points; k++) {
        const hz = FMIN * Math.pow(FMAX / FMIN, k / points)
        const db = fn(hz)
        if (db < -PLOT_DB) { pen = false; continue }
        const x = p.x + k / points * p.w, y = yOf(db, p)
        if (pen) ctx.lineTo(x, y); else ctx.moveTo(x, y)
        pen = true
      }
      ctx.stroke()
    }
    // One curve per active band, then the total on top.
    for (let i = 0; i < BANDS; i++) {
      if (!isActive(bands[i])) continue
      trace(hz => bandResponseDb(bands[i], hz, displayRate), COLORS[i] + (i + 1 === selected ? 'cc' : '5a'), i + 1 === selected ? 1.8 : 1.2)
    }
    trace(hz => totalResponseDb(bands, hz, displayRate), ACCENT, 2.6)

    // Nodes: a number and a colour, a filled disc when the band is on and a ring when it is off, and a ring around
    // the selected one. State is carried by shape and text as well as colour.
    ctx.font = 'bold 11px system-ui, sans-serif'
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
    for (let b = 1; b <= BANDS; b++) {
      const x = xOf(values[`band${b}_freq`], p), y = nodeY(b, p)
      const on = values[`band${b}_on`] >= 0.5
      const r = b === selected ? 10 : 8
      ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI)
      if (on) { ctx.fillStyle = COLORS[b - 1]; ctx.fill() } else {
        ctx.fillStyle = '#1a1e24'; ctx.fill()
        ctx.lineWidth = 1.6; ctx.strokeStyle = COLORS[b - 1]; ctx.stroke()
      }
      if (b === selected) {
        ctx.beginPath(); ctx.arc(x, y, r + 3, 0, 2 * Math.PI)
        ctx.lineWidth = 1.5; ctx.strokeStyle = '#f0ece0'; ctx.stroke()
      }
      ctx.fillStyle = on ? '#14161a' : COLORS[b - 1]
      ctx.fillText(String(b), x, y + 0.5)
    }
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'
  }

  // --- formatting -------------------------------------------------------------------
  const fmtFreq = v => v >= 1000 ? `${(v / 1000).toFixed(v >= 10000 ? 1 : 2)} kHz` : `${Math.round(v)} Hz`
  const fmtGain = v => `${v >= 0 ? '+' : ''}${Number(v).toFixed(1)} dB`
  const fmtQ = v => `Q ${Number(v).toFixed(2)}`
  const fmtCc = v => v < 0.5 ? 'off' : `channel ${Math.round(v)}`

  // --- the controls ------------------------------------------------------------------
  const el = {}
  let bandButtons = []
  const logPosition = (v, lo, hi) => Math.log(v / lo) / Math.log(hi / lo) * 1000
  const fromLogPosition = (pos, lo, hi) => lo * Math.pow(hi / lo, pos / 1000)
  const stage = () => document.getElementById('stage')
  const say = text => { el.status.textContent = text }

  function describeBand (b) {
    const parts = [`Band ${b}`, TYPE_NAMES[Math.round(values[`band${b}_type`])], fmtFreq(values[`band${b}_freq`])]
    if (usesGain(band(b))) parts.push(fmtGain(values[`band${b}_gain`]))
    if (usesQ(band(b))) parts.push(fmtQ(values[`band${b}_q`]))
    parts.push(values[`band${b}_on`] >= 0.5 ? 'on' : 'off')
    return parts.join(', ')
  }

  function refreshBandStrip () {
    for (let b = 1; b <= BANDS; b++) {
      const button = bandButtons[b - 1]
      if (!button) continue
      button.setAttribute('aria-pressed', String(b === selected))
      button.classList.toggle('off', values[`band${b}_on`] < 0.5)
      button.querySelector('.t').textContent = TYPE_NAMES[Math.round(values[`band${b}_type`])] ?? ''
      button.setAttribute('aria-label', describeBand(b))
    }
  }

  function setSegments (group, value) {
    for (const input of group.querySelectorAll('input')) input.checked = Number(input.value) === Math.round(value)
  }

  function refreshEditor () {
    const b = selected
    const bd = band(b)
    el.on.checked = bd.on >= 0.5
    el.type.value = String(Math.round(bd.type))
    const mode = Math.round(values.mode)
    // A control nobody can use is left out, not shown disabled: the channel does nothing in Stereo mode, gain does
    // nothing on a cut or a notch, and Q does nothing on a cut.
    el.channelRow.hidden = mode === 0
    const names = mode === 2 ? ['M + S', 'Mid', 'Side'] : ['L + R', 'Left', 'Right']
    el.channelLabels.forEach((span, i) => { span.textContent = names[i] })
    setSegments(el.channel, bd.channel)

    el.freq.slider.value = String(logPosition(bd.freq, FMIN, FMAX))
    el.freq.number.value = String(Math.round(bd.freq * 10) / 10)
    el.freq.out.textContent = fmtFreq(bd.freq)
    el.freq.slider.setAttribute('aria-valuetext', fmtFreq(bd.freq))

    el.gain.row.hidden = el.gain.row2.hidden = !usesGain(bd)
    if (usesGain(bd)) {
      el.gain.slider.value = String(bd.gain)
      el.gain.number.value = String(Math.round(bd.gain * 10) / 10)
      el.gain.out.textContent = fmtGain(bd.gain)
      el.gain.slider.setAttribute('aria-valuetext', fmtGain(bd.gain))
    }
    el.q.row.hidden = el.q.row2.hidden = !usesQ(bd)
    if (usesQ(bd)) {
      el.q.slider.value = String(logPosition(bd.q, QMIN, QMAX))
      el.q.number.value = String(Math.round(bd.q * 100) / 100)
      el.q.out.textContent = fmtQ(bd.q)
      el.q.slider.setAttribute('aria-valuetext', fmtQ(bd.q))
    }
    el.bandBox.querySelector('legend').textContent = `Band ${b}: ${TYPE_NAMES[Math.round(bd.type)]}, ${fmtFreq(bd.freq)}`

    setSegments(el.mode, values.mode)
    setSegments(el.source, values.spectrum_source)
    el.output.slider.value = String(values.output)
    el.output.number.value = String(Math.round(values.output * 10) / 10)
    el.output.out.textContent = fmtGain(values.output)
    el.output.slider.setAttribute('aria-valuetext', fmtGain(values.output))
    el.ccChannel.value = String(Math.round(values.cc_channel))
    el.ccBand.value = String(Math.round(values.cc_band))
  }

  function refresh () {
    refreshBandStrip()
    refreshEditor()
    queueDraw()
  }

  function show (symbol, value) {
    if (!(symbol in values)) return
    values[symbol] = value
    refresh()
  }

  // A slider with a number box beside it for typing a value. A drag is one gesture, so automation records it as one;
  // the symbol is read when the gesture starts, since the selected band cannot change mid-drag.
  function sliderRow (parent, id, label, symbolOf, min, max, step, numberMin, numberMax, numberStep, commit) {
    const row = document.createElement('div')
    row.className = 'row'
    const tag = document.createElement('label')
    tag.setAttribute('for', id)
    tag.textContent = label
    const slider = document.createElement('input')
    slider.type = 'range'
    slider.id = id
    slider.min = String(min); slider.max = String(max); slider.step = String(step)
    const out = document.createElement('output')
    out.setAttribute('for', id)
    out.setAttribute('aria-hidden', 'true')
    row.append(tag, slider, out)
    const row2 = document.createElement('div')
    row2.className = 'row'
    const tag2 = document.createElement('label')
    tag2.setAttribute('for', `${id}-number`)
    tag2.textContent = `${label} (type a value)`
    const number = document.createElement('input')
    number.type = 'number'
    number.id = `${id}-number`
    number.min = String(numberMin); number.max = String(numberMax); number.step = String(numberStep)
    row2.append(tag2, number)
    slider.addEventListener('pointerdown', () => send({ type: 'gesture', symbol: symbolOf(), phase: 'begin' }))
    slider.addEventListener('pointerup', () => send({ type: 'gesture', symbol: symbolOf(), phase: 'end' }))
    slider.addEventListener('input', () => commit(Number(slider.value), 'slider'))
    number.addEventListener('change', () => commit(Number(number.value), 'number'))
    parent.append(row, row2)
    return { row, row2, slider, number, out }
  }

  // A choice of a few, drawn as a row of segments. Native radio buttons underneath, so the arrow keys and the group's
  // name come from the platform.
  function segments (parent, name, label, labels, onChange) {
    const group = document.createElement('fieldset')
    group.className = 'segments'
    group.setAttribute('aria-label', label)
    group.style.padding = '0'
    group.style.margin = '0'
    const spans = []
    labels.forEach((text, i) => {
      const l = document.createElement('label')
      const input = document.createElement('input')
      input.type = 'radio'
      input.name = name
      input.value = String(i)
      const span = document.createElement('span')
      span.textContent = text
      input.addEventListener('change', () => { if (input.checked) onChange(i) })
      l.append(input, span)
      group.append(l)
      spans.push(span)
    })
    parent.append(group)
    return { group, spans }
  }

  function labelled (parent, text, control, className = 'row plain') {
    const row = document.createElement('div')
    row.className = className
    const name = document.createElement('span')
    name.className = 'name'
    name.textContent = text
    row.append(name, control)
    parent.append(row)
    return row
  }

  function build () {
    const root = stage()
    root.replaceChildren()

    // The global controls above the plot: the stereo mode, the spectrum tap and the output level.
    const top = document.querySelector('.top')
    top.replaceChildren(top.querySelector('h1') ?? document.createElement('h1'))
    const modeSeg = segments(top, 'mode', 'Stereo mode', ['Stereo', 'Left / Right', 'Mid / Side'], i => request('mode', i))
    el.mode = modeSeg.group
    const sourceSeg = segments(top, 'source', 'Spectrum analyser, before or after the EQ', ['Off', 'Pre', 'Post'], i => request('spectrum_source', i))
    el.source = sourceSeg.group
    // The two groups need a visible name beside them, which a group label alone does not give.
    modeSeg.group.title = 'Stereo mode'
    sourceSeg.group.title = 'Spectrum: off, before the EQ, or after it'

    canvas = document.createElement('canvas')
    canvas.id = 'plot'
    ctx = canvas.getContext('2d')
    canvas.setAttribute('tabindex', '0')
    canvas.setAttribute('role', 'application')
    canvas.setAttribute('aria-roledescription', 'frequency response plot')
    canvas.setAttribute('aria-label',
      'Frequency response from 20 hertz to 20 kilohertz, plus and minus 24 decibels, with a node for each of the eight bands. ' +
      'Number keys 1 to 8 choose a band. Left and right change its frequency, up and down its gain, Page Up and Page Down its Q, ' +
      'and Enter switches it on or off. The controls below reach every band as well.')
    el.status = document.createElement('p')
    el.status.className = 'sr'
    el.status.setAttribute('role', 'status')
    root.append(canvas, el.status)

    const strip = document.createElement('div')
    strip.className = 'bands'
    strip.setAttribute('role', 'group')
    strip.setAttribute('aria-label', 'Bands')
    bandButtons = []
    for (let b = 1; b <= BANDS; b++) {
      const button = document.createElement('button')
      button.type = 'button'
      const n = document.createElement('span')
      n.className = 'n'
      n.textContent = String(b)
      const t = document.createElement('span')
      t.className = 't'
      button.append(n, t)
      button.addEventListener('click', () => { selected = b; refresh() })
      strip.append(button)
      bandButtons.push(button)
    }
    root.append(strip)

    el.bandBox = document.createElement('fieldset')
    el.bandBox.append(document.createElement('legend'))

    const onRow = document.createElement('div')
    onRow.className = 'row plain'
    const onLabel = document.createElement('label')
    onLabel.setAttribute('for', 'band-on')
    onLabel.textContent = 'Band on'
    el.on = document.createElement('input')
    el.on.type = 'checkbox'
    el.on.id = 'band-on'
    el.on.addEventListener('change', () => request(`band${selected}_on`, el.on.checked ? 1 : 0))
    onRow.append(onLabel, el.on)
    el.bandBox.append(onRow)

    el.type = document.createElement('select')
    el.type.id = 'band-type'
    TYPE_NAMES.forEach((name, i) => {
      const option = document.createElement('option')
      option.value = String(i)
      option.textContent = name
      el.type.append(option)
    })
    el.type.addEventListener('change', () => request(`band${selected}_type`, Number(el.type.value)))
    const typeRow = document.createElement('div')
    typeRow.className = 'row plain'
    const typeLabel = document.createElement('label')
    typeLabel.setAttribute('for', 'band-type')
    typeLabel.textContent = 'Type'
    typeRow.append(typeLabel, el.type)
    el.bandBox.append(typeRow)

    const channelSeg = segments(document.createElement('div'), 'channel', 'Channel this band acts on', ['L + R', 'Left', 'Right'], i => request(`band${selected}_channel`, i))
    el.channel = channelSeg.group
    el.channelLabels = channelSeg.spans
    el.channelRow = labelled(el.bandBox, 'Acts on', el.channel)

    el.freq = sliderRow(el.bandBox, 'band-freq', 'Frequency', () => `band${selected}_freq`, 0, 1000, 1, FMIN, FMAX, 0.1,
      (v, from) => {
        const hz = from === 'slider' ? fromLogPosition(v, FMIN, FMAX) : Math.min(FMAX, Math.max(FMIN, v))
        if (Number.isFinite(hz)) request(`band${selected}_freq`, hz)
      })
    el.gain = sliderRow(el.bandBox, 'band-gain', 'Gain', () => `band${selected}_gain`, -GAIN_MAX, GAIN_MAX, 0.1, -GAIN_MAX, GAIN_MAX, 0.1,
      v => { if (Number.isFinite(v)) request(`band${selected}_gain`, Math.min(GAIN_MAX, Math.max(-GAIN_MAX, v))) })
    el.q = sliderRow(el.bandBox, 'band-q', 'Q', () => `band${selected}_q`, 0, 1000, 1, QMIN, QMAX, 0.01,
      (v, from) => {
        const q = from === 'slider' ? fromLogPosition(v, QMIN, QMAX) : Math.min(QMAX, Math.max(QMIN, v))
        if (Number.isFinite(q)) request(`band${selected}_q`, q)
      })
    root.append(el.bandBox)

    const outputBox = document.createElement('fieldset')
    outputBox.append(Object.assign(document.createElement('legend'), { textContent: 'Output and MIDI' }))
    el.output = sliderRow(outputBox, 'output-level', 'Output', () => 'output', -12, 12, 0.1, -12, 12, 0.1,
      v => { if (Number.isFinite(v)) request('output', Math.min(12, Math.max(-12, v))) })
    el.ccChannel = document.createElement('input')
    el.ccChannel.type = 'number'
    el.ccChannel.id = 'cc-channel'
    el.ccChannel.min = '0'; el.ccChannel.max = '16'; el.ccChannel.step = '1'
    el.ccChannel.addEventListener('change', () => {
      const v = Math.round(Number(el.ccChannel.value))
      if (Number.isFinite(v)) request('cc_channel', Math.min(16, Math.max(0, v)))
    })
    const ccRow = document.createElement('div')
    ccRow.className = 'row plain'
    const ccLabel = document.createElement('label')
    ccLabel.setAttribute('for', 'cc-channel')
    ccLabel.textContent = 'CC channel (0 ignores MIDI)'
    ccRow.append(ccLabel, el.ccChannel)
    outputBox.append(ccRow)
    el.ccBand = document.createElement('select')
    el.ccBand.id = 'cc-band'
    for (let b = 1; b <= BANDS; b++) el.ccBand.append(Object.assign(document.createElement('option'), { value: String(b), textContent: `Band ${b}` }))
    el.ccBand.addEventListener('change', () => request('cc_band', Number(el.ccBand.value)))
    const ccBandRow = document.createElement('div')
    ccBandRow.className = 'row plain'
    const ccBandLabel = document.createElement('label')
    ccBandLabel.setAttribute('for', 'cc-band')
    ccBandLabel.textContent = 'CC band'
    ccBandRow.append(ccBandLabel, el.ccBand)
    outputBox.append(ccBandRow)
    const hint = document.createElement('p')
    hint.className = 'hint'
    hint.textContent = 'Drag a node: across for frequency, up and down for gain. Scroll over the plot to change Q. ' +
      'Cuts and notches have no gain. MIDI controllers 1 to 4 on the CC channel drive the chosen band’s frequency, gain and Q, ' +
      'and the output; a controller holds its control until you move it here.'
    outputBox.append(hint)
    root.append(outputBox)

    wirePlot()
    window.addEventListener('resize', queueDraw)
    refresh()
  }

  // --- the pointer and the keyboard on the plot ---------------------------------------------
  function wirePlot () {
    let drag = null
    const position = event => {
      const rect = canvas.getBoundingClientRect()
      return { x: event.clientX - rect.left, y: event.clientY - rect.top }
    }
    const nodeAt = (x, y, reach) => {
      const p = plotBox()
      let best = -1, bestD = reach * reach
      for (let b = 1; b <= BANDS; b++) {
        const dx = xOf(values[`band${b}_freq`], p) - x, dy = nodeY(b, p) - y
        const d = dx * dx + dy * dy
        // The selected band wins where nodes overlap.
        if (d < bestD || (d === bestD && b === selected)) { bestD = d; best = b }
      }
      return best
    }
    const gestures = (b, phase) => {
      send({ type: 'gesture', symbol: `band${b}_freq`, phase })
      if (usesGain(band(b))) send({ type: 'gesture', symbol: `band${b}_gain`, phase })
    }

    canvas.addEventListener('pointerdown', event => {
      if (event.button !== 0) return
      const { x, y } = position(event)
      const b = nodeAt(x, y, event.pointerType === 'touch' ? 24 : 16)
      if (b < 0) return
      event.preventDefault()
      selected = b
      drag = { band: b }
      canvas.setPointerCapture(event.pointerId)
      canvas.focus({ preventScroll: true })
      // Grabbing a band that is off turns it on, so a drag always has an audible result.
      if (values[`band${b}_on`] < 0.5) request(`band${b}_on`, 1)
      gestures(b, 'begin')
      refresh()
    })
    canvas.addEventListener('pointermove', event => {
      if (!drag) return
      const { x, y } = position(event)
      const p = plotBox()
      request(`band${drag.band}_freq`, hzOf(x, p))
      if (usesGain(band(drag.band))) request(`band${drag.band}_gain`, Math.min(GAIN_MAX, Math.max(-GAIN_MAX, dbOf(y, p))))
    })
    const endDrag = () => {
      if (!drag) return
      gestures(drag.band, 'end')
      drag = null
    }
    canvas.addEventListener('pointerup', endDrag)
    canvas.addEventListener('pointercancel', endDrag)

    // The wheel over the plot changes the selected band's Q, where it has one; elsewhere the page scrolls as usual.
    canvas.addEventListener('wheel', event => {
      const bd = band(selected)
      if (!usesQ(bd)) return
      const { x, y } = position(event)
      const p = plotBox()
      if (x < p.x || x > p.x + p.w || y < p.y || y > p.y + p.h) return
      event.preventDefault()
      const steps = Math.max(-3, Math.min(3, -event.deltaY / (event.deltaMode === 1 ? 3 : 100)))
      request(`band${selected}_q`, Math.min(QMAX, Math.max(QMIN, bd.q * Math.pow(1.12, steps))))
    }, { passive: false })

    // Everything the pointer does, the keys do: 1 to 8 choose a band, the arrows move it, Page Up and Down change
    // its Q, Enter switches it. Shift takes a bigger step and Alt a finer one.
    canvas.addEventListener('keydown', event => {
      if (event.ctrlKey || event.metaKey) return
      const b = selected
      const bd = band(b)
      const scale = event.shiftKey ? 4 : event.altKey ? 0.25 : 1
      let handled = true
      if (/^[1-8]$/.test(event.key)) { selected = Number(event.key); refresh(); say(describeBand(selected)); event.preventDefault(); return }
      switch (event.key) {
        case 'ArrowLeft': request(`band${b}_freq`, Math.max(FMIN, bd.freq * Math.pow(2, -scale / 12))); break
        case 'ArrowRight': request(`band${b}_freq`, Math.min(FMAX, bd.freq * Math.pow(2, scale / 12))); break
        case 'ArrowUp': if (usesGain(bd)) request(`band${b}_gain`, Math.min(GAIN_MAX, bd.gain + 0.5 * scale)); break
        case 'ArrowDown': if (usesGain(bd)) request(`band${b}_gain`, Math.max(-GAIN_MAX, bd.gain - 0.5 * scale)); break
        case 'PageUp': if (usesQ(bd)) request(`band${b}_q`, Math.min(QMAX, bd.q * Math.pow(1.12, scale))); break
        case 'PageDown': if (usesQ(bd)) request(`band${b}_q`, Math.max(QMIN, bd.q / Math.pow(1.12, scale))); break
        case 'Enter': case ' ': request(`band${b}_on`, bd.on >= 0.5 ? 0 : 1); break
        default: handled = false
      }
      if (handled) event.preventDefault()
    })
    canvas.addEventListener('focus', () => say(describeBand(selected)))
  }

  // Ask for the height the content takes, whenever that changes. Measured by an observer rather than once after
  // building, because a single measurement taken before layout settled asks for less than half the height needed.
  const root = document.getElementById('root')
  const wanted = () => Math.ceil(document.documentElement.getBoundingClientRect().height)
  new ResizeObserver(() => {
    send({ type: 'resize', width: document.body.scrollWidth, height: wanted() })
  }).observe(root)

  // What the processor measured: 64 levels in decibels, the rate it runs at, and the tap they came from. Data only,
  // and checked before it is used, since the frame trusts nothing it is sent beyond what it can verify.
  function takeSpectrum (payload) {
    if (!payload || typeof payload !== 'object') return
    const levels = payload.levels
    if (!(Array.isArray(levels) || ArrayBuffer.isView(levels)) || levels.length !== SPECTRUM_BINS) return
    for (let k = 0; k < SPECTRUM_BINS; k++) {
      const v = Number(levels[k])
      spectrum[k] = Number.isFinite(v) ? Math.min(6, Math.max(SPECTRUM_FLOOR, v)) : SPECTRUM_FLOOR
    }
    const rate = Number(payload.rate)
    if (Number.isFinite(rate) && rate >= 8000 && rate <= 384000) displayRate = rate
    queueDraw()
  }

  window.addEventListener('message', event => {
    if (event.source !== parent) return
    if (host === null) {
      if (event.data?.type !== 'init') return
      host = event.origin
      const parameters = event.data.parameters ?? {}
      for (const symbol of Object.keys(values)) {
        if (Number.isFinite(parameters[symbol])) values[symbol] = parameters[symbol]
      }
      build()
      send({ type: 'resize', width: document.body.scrollWidth, height: wanted() })
      return
    }
    if (event.origin !== host) return
    const message = event.data
    if (message?.type === 'parameter') show(message.symbol, message.value)
    else if (message?.type === 'plugin') takeSpectrum(message.payload)
  })

  // The host's origin is not known yet, so ready goes to any. It carries nothing, and every later message goes to
  // the origin init came from.
  parent.postMessage({ type: 'ready' }, '*')
</script>
</body>
</html>
