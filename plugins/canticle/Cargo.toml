[package]
name = "canticle"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Twelve-voice polyphonic tonal instrument: keys, reed, pad, pluck and glass"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
strip = true
