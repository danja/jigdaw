[package]
name = "cadence"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Transport synced MIDI harmonizer that learns a cycle and plays voiced chord progressions"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
strip = true
