[package]
name = "drumkit"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Eleven voice synthesised drum instrument, the worked JigDAW drum instrument"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
strip = true
