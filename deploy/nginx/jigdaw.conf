# deploy/nginx/jigdaw.conf
#
# The JigDAW location block, to be included inside the existing
# `server { server_name strandz.it; ... }` block in strandz.it.conf.
#
# JigDAW is a plugin ORIGIN as well as a site. Every header below is load
# bearing, and a plugin origin that omits one serves plugins that no host can
# load, with a failure that names nothing: a cross-origin response without
# Access-Control-Allow-Origin is unreadable to JavaScript rather than merely
# untrusted. Contract section 1.3.
#
# Note the trailing slash on proxy_pass. It strips the /jigdaw/ prefix, so the
# application behind it serves at its own root and is identical in development
# and production. Removing that slash breaks every path silently.

location /jigdaw/ {
    proxy_pass http://127.0.0.1:6011/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The application sets these headers too, because it is the reference for
    # what a plugin origin must send and it has to be correct when run without
    # a proxy in front of it. Adding them again here would send each one twice,
    # and a browser rejects Access-Control-Allow-Origin with multiple values
    # outright: every cross-origin plugin load would fail with a message about
    # the header containing multiple values. So the upstream copy is dropped
    # and nginx owns them at the edge, which is also what makes them present on
    # responses nginx generates itself.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;

    # An `add_header` inside a location REPLACES the server block's headers
    # rather than adding to them. So every header this location needs is
    # repeated here, including the ones that look like they belong at server
    # level. If security headers are added to the server block later, they must
    # be repeated here too or this path silently serves without them: valid
    # configuration, wrong behaviour.
    #
    # `always` so they are sent on error responses as well as on 200s. A 404
    # for a profile is still a cross-origin response a host has to read.
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Headers "accept, content-type" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;

    # Required of every cross-origin subresource under COEP require-corp, so a
    # host that opts into cross-origin isolation can still load these.
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Media types come from the application, which sets application/wasm and
    # text/turtle itself and negotiates a plugin IRI by Accept. No `types`
    # block here: one would replace the mime map for this location, and the
    # upstream Content-Type is already right.
}

# Preflight. A host sending `Accept: text/turtle` on a cross-origin request
# triggers one, and a 405 from the application would look like the plugin does
# not exist.
location = /jigdaw/preflight-probe {
    return 204;
}
