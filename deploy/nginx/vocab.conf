# deploy/nginx/vocab.conf
#
# The JigDAW vocabulary at https://hyperdata.it/xmlns/jigdaw/, to be included
# inside the existing `server { server_name hyperdata.it; ... }` block.
#
# The PURL http://purl.org/stuff/jigdaw/ already redirects here through the
# wildcard that maps purl.org/stuff/<name> to hyperdata.it/xmlns/<name>, so no
# PURL administration is needed. Serving these files is the whole job.
#
# docs/namespace.md is the specification. Two decisions in it are visible here.
#
# A term answers 303, not 200. The term denotes a property or a class, not a
# document, and answering 200 would assert that the thing identified IS the page
# returned. It is the one place where that distinction has a practical
# consequence: a reasoner that conflates them starts inferring that a property
# is a document.
#
# CORS, because a browser fetching the vocabulary cross-origin cannot read a
# response without it, exactly as for a plugin profile.

# The bare form, without the trailing slash.
#
# The namespace IRI ends in a slash, and that is what appears in every profile,
# but a person will type the short form and the PURL passes through whatever it
# was given. A 301 to the canonical form costs one redirect and turns a 404 into
# a working address.
location = /xmlns/jigdaw {
    return 301 /xmlns/jigdaw/;
}

# The namespace IRI itself. Content negotiated, HTML by default so that pasting
# it into a browser shows something useful.
location = /xmlns/jigdaw/ {
    root /home/github/jigdaw/deploy/vocab;

    add_header Access-Control-Allow-Origin  "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header X-Content-Type-Options       "nosniff" always;

    # `if` is discouraged in a location, and is documented as safe with
    # `return` and `rewrite`, which is all it does here.
    if ($http_accept ~* "text/turtle|application/ld\+json|application/turtle") {
        rewrite ^ /xmlns/jigdaw/jigdaw.ttl last;
    }

    try_files /index.html =404;
}

# The Turtle document.
location = /xmlns/jigdaw/jigdaw.ttl {
    alias /home/github/jigdaw/deploy/vocab/jigdaw.ttl;
    # .ttl is not in nginx's mime map. default_type rather than a `types` block,
    # which would replace the whole map for this location.
    default_type "text/turtle; charset=utf-8";

    add_header Access-Control-Allow-Origin  "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header X-Content-Type-Options       "nosniff" always;
}

# Every term. `jig:module` and the rest each get a 303 to the document that
# defines them. The pattern excludes anything with a dot, so the .ttl above is
# matched by its own exact location rather than swallowed here.
location ~ ^/xmlns/jigdaw/([A-Za-z][A-Za-z0-9_]*)$ {
    add_header Access-Control-Allow-Origin "*" always;
    return 303 https://hyperdata.it/xmlns/jigdaw/;
}
