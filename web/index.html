<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JigDAW</title>
<style>
  :root { color-scheme: dark; --bg:#14161a; --fg:#e6e6e6; --dim:#8b93a1; --ok:#7ddc8e; --err:#ff8a8a; --line:#2a2f38; }
  body { margin:0; font:14px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:16px 20px; border-bottom:1px solid var(--line); }
  h1 { margin:0 0 4px; font-size:18px; font-weight:600; }
  .sub { color:var(--dim); font-size:12px; }
  main { display:grid; grid-template-columns: 1fr 1fr; gap:20px; padding:20px; align-items:start; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; grid-column:1/-1; }
  /* 16px or larger, or iOS zooms the page in when the field takes focus. */
  input[type=text] { flex:1 1 12rem; min-width:0; padding:10px 12px; background:#0e1013; color:var(--fg); border:1px solid var(--line); border-radius:4px; font-family:ui-monospace,monospace; font-size:16px; }
  /* WCAG 2.5.8: a touch target is at least 24px, and 44px is comfortable. */
  button { min-height:44px; padding:10px 20px; background:#2b6cb0; color:#fff; border:0; border-radius:4px; cursor:pointer; font-size:16px; }
  button:hover { background:#3182ce; }
  :focus-visible { outline:2px solid #7fb3ff; outline-offset:2px; }
  .panel { border:1px solid var(--line); border-radius:6px; padding:14px; margin-bottom:14px; background:#181b21; }
  .panel h3 { margin:0 0 4px; font-size:15px; }
  .description { margin:0 0 12px; color:var(--dim); font-size:12px; }
  .control { display:grid; grid-template-columns:110px 1fr 70px; gap:10px; align-items:center; margin-bottom:12px; }
  .control label { color:var(--dim); font-size:13px; }
  .control .value { font-family:ui-monospace,monospace; font-size:13px; text-align:right; }
  /* A slider thumb is the touch target, so the track needs room around it. */
  input[type=range] { width:100%; min-width:0; height:44px; }
  input[type=checkbox] { width:24px; height:24px; }
  select { background:#0e1013; color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:10px; font-size:16px; min-height:44px; }
  #log { overflow-wrap:anywhere; }

  /* One column on a phone. The log goes under the panels rather than beside
     them, because a plugin panel is what someone came for and a two column
     grid at 390px gives neither enough room. */
  @media (max-width: 720px) {
    main { grid-template-columns: 1fr; gap:16px; padding:16px; }
    header { padding:14px 16px; }
    .control { grid-template-columns:1fr auto; gap:4px 10px; }
    .control label { grid-column:1; }
    .control .value { grid-column:2; }
    .control input, .control select { grid-column:1 / -1; }
    #log { max-height:40vh; }
  }

  /* Respect a reduced-motion preference: nothing here animates, but the rule
     documents that and stops a future addition being added without one. */
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
  }
  #log { font-family:ui-monospace,monospace; font-size:12px; border:1px solid var(--line); border-radius:6px; padding:12px; background:#0e1013; max-height:70vh; overflow:auto; }
  .log-line { padding:2px 0; border-bottom:1px solid #1b1f26; white-space:pre-wrap; word-break:break-word; }
  .log-ok { color:var(--ok); } .log-error { color:var(--err); }
  #state { color:var(--dim); font-size:12px; }
  .visually-hidden { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  input[type=search] { flex:1 1 12rem; min-width:0; padding:10px 12px; background:#0e1013; color:var(--fg); border:1px solid var(--line); border-radius:4px; font-size:16px; }
  #results { grid-column:1/-1; }
  #results:empty { display:none; }
  .result { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:baseline; padding:10px 12px; border:1px solid var(--line); border-radius:6px; margin-bottom:8px; background:#181b21; }
  .result .name { font-weight:600; }
  .result .meta { color:var(--dim); font-size:12px; flex:1 1 10rem; }
  .result button { min-height:44px; padding:8px 14px; font-size:14px; }
  .result .native { color:var(--dim); font-size:12px; font-style:italic; }
  .badge { font-size:11px; padding:2px 7px; border-radius:99px; background:#2b6cb0; color:#fff; }
  .results-note { color:var(--dim); font-size:12px; margin:4px 0 10px; }
</style>
</head>
<body>
<header>
  <h1>JigDAW</h1>
  <div class="sub">A plugin is a URL. Dereference it and it is running. <span id="state">no audio context yet</span></div>
</header>
<main>
  <form class="bar" id="searchbar" role="search">
    <label class="visually-hidden" for="q">Search for plugins</label>
    <input type="search" id="q" placeholder="Search instruments and effects" spellcheck="false">
    <label class="visually-hidden" for="facet">Filter by kind</label>
    <select id="facet">
      <option value="">Anything</option>
      <option value="role=Instrument">Instruments</option>
      <option value="role=AudioEffect">Effects</option>
      <option value="accepts=Midi">Accepts MIDI</option>
      <option value="produces=Midi">Produces MIDI</option>
    </select>
    <button type="submit" id="search">Search</button>
  </form>
  <div id="results" aria-live="polite"></div>
  <div class="bar">
    <label class="visually-hidden" for="iri">Plugin IRI</label>
    <input type="text" id="iri" value="plugins/cascade/" spellcheck="false">
    <button id="load">Load</button>
  </div>
  <div id="panels"></div>
  <div id="log"></div>
</main>
<script type="module" src="./app.bundle.js"></script>
</body>
</html>
