<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse panel</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#101216; --panel:#181b21; --fg:#e8eaed; --dim:#8b93a1;
    --line:#2a2f38; --accent:#3182ce; --ok:#7ddc8e; --err:#ff8a8a; --wire:#4a5464;
    }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  :focus-visible { outline:2px solid #7fb3ff; outline-offset:2px; }
  .visually-hidden { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* Channel strip. Not a plugin panel: these are host services. */
  /* Contract section 12.5. The word "foreign" in the heading is what carries
     this; the outline is a second signal for a sighted reader and never the
     only one, because section 12.5 forbids colour alone. */
  .foreign { font-size:11px; letter-spacing:.04em; text-transform:uppercase;
             border:1px solid var(--err); color:var(--err); border-radius:3px;
             padding:1px 5px; margin-left:6px; vertical-align:middle; }
  .is-foreign { outline:1px dashed var(--err); outline-offset:2px; }
  /* Contract section 12.4. Wide enough to read four statements, and the
     refusal is the plain button while running it is the marked one. */
  .consent { max-width:34rem; border:1px solid var(--rule,#3a4150); border-radius:8px;
             background:#1a1d23; color:var(--fg,#e6e8ec); padding:1.25rem; }
  .consent::backdrop { background:rgba(0,0,0,.6); }
  .consent h2 { font-size:1.1rem; margin:0 0 .75rem; }
  .consent ul { margin:0 0 1.25rem; padding-left:1.1rem; line-height:1.55; }
  .consent li { margin-bottom:.4rem; }
  .consent-buttons { display:flex; gap:10px; flex-wrap:wrap; }
  .consent-buttons button { min-height:44px; font-size:16px; padding:8px 16px; }
  .consent-buttons .danger { border-color:var(--err); color:var(--err); }
  /* A row of knobs and the two buttons, rather than a column of full width
     sliders. Wraps, so a narrow screen puts the buttons underneath instead of
     pushing them off the side. */
  .strip { display:flex; flex-direction:row; flex-wrap:wrap; align-items:center;
           gap:6px 18px; padding:10px 14px;
           border-bottom:1px solid var(--line); background:rgba(255,255,255,.02); }
  .strip.silent { opacity:.55; }
  .strip-control { display:flex; flex-direction:column; align-items:center; gap:3px; }
  .strip-control label { color:var(--dim); font-size:11px; }
  .strip-control .value { min-width:78px; text-align:center;
                          font-variant-numeric:tabular-nums; font-size:12px; color:var(--dim); }
  .strip-buttons { display:flex; gap:8px; }
  /* State is said by aria-pressed as well as shown, because it must not be
     signalled by colour alone. */
  .strip-toggle { min-height:32px; min-width:64px; padding:6px 12px; font-size:12px;
                  border:1px solid var(--line); border-radius:4px;
                  background:var(--panel); color:var(--fg); cursor:pointer; }
  .strip-toggle[aria-pressed="true"] { border-color:var(--accent); }
  .strip-toggle.muted[aria-pressed="true"]  { background:var(--err); color:#111; }
  .strip-toggle.soloed[aria-pressed="true"] { background:var(--ok);  color:#111; }
  @media (max-width: 760px) {
    .strip-toggle { min-height:44px; }
  }


/* Ports and connections. A connection list rather than a node canvas: a
     drag between two points is hard to operate from a keyboard, and hit
     testing a graph at phone width is a fight the layout loses. */
  /* :empty, because the bar draws nothing at rest for a plugin with no
     outputs and an empty box with padding is a gap nobody asked for. */
  .ports:empty { display:none; }
  .ports { display:flex; flex-wrap:wrap; gap:6px; padding:8px 14px;
           border-bottom:1px solid var(--line); }
  .port { min-height:32px; padding:5px 10px; font-size:12px; cursor:pointer;
          border:1px solid var(--line); border-radius:4px;
          background:var(--panel); color:var(--fg); }
  .port:disabled { opacity:.4; cursor:not-allowed; }
  .port-out { border-left:3px solid var(--accent); }
  .port-in  { border-left:3px solid var(--dim); }
  .port.pending { background:var(--accent); color:#111; border-color:var(--accent); }
  .port-none { color:var(--dim); font-size:12px; }

  .connections-heading { margin:18px 0 8px; font-size:13px; color:var(--dim);
                         text-transform:uppercase; letter-spacing:.06em; }
  .connections { display:flex; flex-direction:column; gap:6px; }
  .connection { display:flex; align-items:center; gap:10px; padding:8px 12px;
                border:1px solid var(--line); border-radius:5px; background:var(--panel); }
  .connection-text { flex:1 1 auto; font-size:13px; min-width:0; }
  /* Named, not only coloured: an audio edge and a host-routed MIDI edge are
     handled by entirely different machinery. */
  .connection-kind { flex:0 0 auto; font-size:11px; padding:2px 7px; border-radius:3px;
                     border:1px solid var(--line); color:var(--dim); }
  .connection-kind.MIDI { border-color:var(--ok); color:var(--ok); }
  .connection-remove { flex:0 0 auto; min-height:32px; padding:5px 10px; font-size:12px;
                       border:1px solid var(--line); border-radius:4px;
                       background:transparent; color:var(--dim); cursor:pointer; }
  .connection-watch { flex:0 0 auto; min-height:32px; padding:5px 10px; font-size:12px;
                      border:1px solid var(--line); border-radius:4px;
                      background:transparent; color:var(--dim); cursor:pointer; }
  .connection-watch[aria-pressed="true"] { border-color:#ffd166; color:var(--fg); }
  .connection-log { margin:0 0 8px 28px; padding:0 0 0 16px; font-size:12px; color:var(--dim); max-height:12rem; overflow:auto; }
  /* A gap where a wire is not, so a stack of slots does not imply a chain. */
  .gap { height:20px; }

  @media (max-width: 760px) {
    .port { min-height:44px; flex:1 1 auto; }
    .connection { flex-wrap:wrap; }
    .connection-remove, .connection-watch { min-height:44px; }
  }


  /* Transport */
  .transport { display:flex; flex-wrap:wrap; align-items:center; gap:12px;
    padding:10px 16px; background:#14171d; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  .brand { font-weight:700; letter-spacing:.5px; margin-right:4px; }
  .transport button { min-height:44px; min-width:44px; padding:8px 14px; font-size:15px;
    background:#242a33; color:var(--fg); border:1px solid var(--line); border-radius:5px; cursor:pointer; }
  .transport button:hover { background:#2d343f; }
  .transport button[aria-pressed=true] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .transport button:disabled { opacity:.4; cursor:not-allowed; }
  .transport button:disabled:hover { background:#242a33; }
  .tempo { display:flex; align-items:center; gap:6px; }
  .tempo input { width:70px; padding:8px; font-size:16px; text-align:right;
    background:#0e1013; color:var(--fg); border:1px solid var(--line); border-radius:4px; }
  .position { font-family:ui-monospace,monospace; font-size:15px; min-width:7ch; color:var(--dim); }
  .links { display:flex; gap:14px; font-size:13px; margin-left:auto; }
  .links a { color:var(--dim); text-decoration:none; padding:6px 2px; }
  .links a:hover { color:var(--fg); text-decoration:underline; }
  .meter { display:flex; gap:3px; align-items:flex-end; height:26px; }
  .meter i { display:block; width:5px; background:#232a33; border-radius:1px; height:100%; }
  .meter i.on { background:var(--ok); }
  .meter i.hot { background:var(--err); }

  /* Layout */
  /* minmax(0, 1fr), not 1fr: a 1fr track grows to the widest thing in it,
     and a timeline or a piano roll is as wide as the music. They scroll in
     their own boxes, so the column must be allowed to be narrower than they are. */
  main { display:grid; grid-template-columns: 240px minmax(0, 1fr); gap:0; min-height:calc(100vh - 62px); }
  /* The browser closed: it is hidden, and the stage has the whole width. */
  main.no-browser { grid-template-columns: minmax(0, 1fr); }
  .browser[hidden] { display:none; }
  .browser { border-right:1px solid var(--line); padding:14px; background:#13161b; }
  /* The Browser's header: its name and a Close button. Opening it is the Browser
     button in the transport bar, which aria-expanded keeps honest. */
  .browser-head { display:flex; align-items:center; gap:8px; margin:0 0 10px; }
  .browser-head h2 { margin:0; flex:1 1 auto; }
  #close-browser { flex:none; min-height:44px; padding:0 14px; background:transparent; color:var(--dim);
    border:1px solid var(--line); border-radius:4px; cursor:pointer; }
  #close-browser:hover { color:var(--fg); border-color:var(--accent); }
  .transport button[aria-expanded=true] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .stage { padding:14px; display:flex; flex-direction:column; gap:12px; min-width:0; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:0 0 10px; }

  /* Tabs. src/ui/Tabs.js builds the buttons; this only draws them. The
     selected tab is said by aria-selected, for a screen reader, and shown by
     weight and an underline together, never by colour alone. */
  .tabs { display:flex; flex-wrap:wrap; gap:4px; border-bottom:1px solid var(--line); margin-bottom:2px; }
  .tab { min-height:44px; padding:10px 18px; font-size:14px; font-weight:400;
    background:transparent; color:var(--dim); border:0; border-bottom:2px solid transparent;
    cursor:pointer; margin-bottom:-1px; }
  .tab[aria-selected="true"] { color:var(--fg); font-weight:600; border-bottom-color:var(--accent); }
  .tab:hover { color:var(--fg); }

  /* Browser */
  .searchbar { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .searchbar input, .searchbar select { padding:9px 10px; font-size:16px; background:#0e1013;
    color:var(--fg); border:1px solid var(--line); border-radius:4px; }
  .searchbar input { flex:1 1 8rem; min-width:0; }
  .searchbar select { flex:1 1 100%; min-height:40px; }
  .searchbar button { flex:1 1 100%; min-height:44px; background:var(--accent); color:#fff;
    border:0; border-radius:4px; font-size:15px; cursor:pointer; }
  .result { padding:6px 10px; border:1px solid var(--line); border-radius:5px; margin-bottom:4px; background:var(--panel); }
  .result .head { display:flex; align-items:center; gap:8px; }
  .result .name { flex:1 1 auto; min-width:0; font-weight:600; font-size:13px; overflow-wrap:anywhere; }
  .result .meta { color:var(--dim); font-size:11px; margin-top:1px; }
  .result button { flex:none; min-height:28px; padding:1px 8px; font-size:11px;
    background:var(--accent); color:#fff; border:0; border-radius:4px; cursor:pointer; }
  .result .native { color:var(--dim); font-size:11px; font-style:italic; }
  .note { color:var(--dim); font-size:11px; margin:6px 0; }
  /* Script tab (src/ui/ScriptPanel.js). The text area is 16px so iOS does not zoom the page in on it, and the
     buttons are 44px. An error is the word "Error" first and a bold line number, never colour alone. */
  .script { display:flex; flex-direction:column; gap:10px; max-width:60rem; }
  .script-label { font-size:12px; color:var(--dim); }
  .script-source { width:100%; min-height:12rem; padding:10px; resize:vertical; tab-size:2;
                   font:16px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;
                   background:#0e1013; color:var(--fg); border:1px solid var(--line); border-radius:4px; }
  .script-actions { display:flex; flex-wrap:wrap; gap:8px; }
  .script-button { min-height:44px; padding:8px 16px; font-size:16px; background:var(--panel); color:var(--fg);
                   border:1px solid var(--line); border-radius:4px; cursor:pointer; }
  #script-run { background:var(--accent); border-color:var(--accent); color:#fff; }
  .script-status { margin:0; min-height:1.5em; color:var(--fg); }
  .script h3 { font-size:13px; margin:6px 0 4px; }
  .script ol, .script ul { margin:0; padding-left:1.4rem; }
  .script-problems-list li { margin-bottom:6px; overflow-wrap:anywhere; }
  .script-problems-list .script-button { min-height:44px; margin-left:6px; padding:4px 12px; font-size:14px; }
  .script-error-word { font-weight:700; color:var(--err); }
  .script-plan-list li, .script-log-list li { overflow-wrap:anywhere; font-family:ui-monospace,monospace; font-size:12px; }
  .script-log-list { list-style:none; padding-left:0; max-height:30vh; overflow:auto; }
  .script-log-error { color:var(--err); }
  /* No display:flex here: it removes the disclosure triangle, which is what says this opens. */
  .script-syntax summary { cursor:pointer; color:var(--dim); font-size:14px; padding:12px 0; min-height:44px; }
  .script-syntax dt { margin-top:8px; }
  .script-syntax dd { margin:2px 0 0 1.2rem; color:var(--dim); font-size:12px; }
  @media (max-width: 720px) { .script-button { flex:1 1 100%; } }

  .collection-name { margin:4px 0 0; font-size:14px; }
  .result.native { opacity:.62; }

  /* Rack */
  .rack { display:flex; flex-direction:column; gap:0; }
  .slot { background:var(--panel); border:1px solid var(--line); border-radius:7px; padding:12px 14px; }
  .slot.source, .slot.output { background:#161a20; border-style:dashed; color:var(--dim); }
  /* Wraps, because a plugin's header holds a grip, its name, two move buttons,
     a track menu and Remove, which is wider than a phone. */
  .slot header { display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; margin-bottom:8px; }
  .slot h3 { margin:0; font-size:15px; flex:1 1 6rem; min-width:0; overflow-wrap:anywhere; }
  .slot .kind { font-size:11px; color:var(--dim); }
  .slot .remove { min-height:32px; padding:4px 10px; font-size:12px; background:#2a2f38;
    color:var(--dim); border:1px solid var(--line); border-radius:4px; cursor:pointer; }
  .slot .remove:hover { color:var(--err); border-color:var(--err); }
  .slot .reorder { min-height:32px; min-width:32px; padding:4px 8px; font-size:12px;
    background:#2a2f38; color:var(--dim); border:1px solid var(--line); border-radius:4px;
    cursor:pointer; }
  .slot .reorder:hover:not(:disabled) { color:var(--fg); border-color:var(--accent); }
  .slot .reorder:disabled { opacity:.4; cursor:default; }
  /* Only this handle is draggable, not the slot: the slot holds knobs and
     other controls with their own pointer-drag behaviour (Dial.js), and
     making the whole thing an HTML5 drag source would fight them for the
     same mousedown. */
  .slot .grip { display:inline-flex; align-items:center; justify-content:center;
    min-height:32px; min-width:32px; padding:4px 8px; font-size:14px;
    background:#2a2f38; color:var(--dim); border:1px solid var(--line); border-radius:4px;
    cursor:grab; touch-action:none; }
  .slot.drag-over { outline:2px dashed var(--accent); outline-offset:-2px; }
  .wire { height:20px; margin-left:26px; border-left:2px solid var(--wire); position:relative; }
  .wire::after { content:""; position:absolute; bottom:-1px; left:-5px;
    border-left:4px solid transparent; border-right:4px solid transparent; border-top:6px solid var(--wire); }
  .wire span { position:absolute; left:10px; top:1px; font-size:10px; color:var(--dim); }
  .empty { color:var(--dim); text-align:center; padding:26px 14px; border:1px dashed var(--line); border-radius:7px; }

  /* Tracks. A track's plugins are grouped under its header, and the group is
     marked by a rule down its left edge as well as by the heading, so the
     grouping does not rest on colour or on position alone. */
  .track { border-left:3px solid var(--line); padding-left:10px; margin-bottom:22px; min-width:0; }
  .track-header { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:10px; }
  .track-header h3 { margin:0; font-size:16px; flex:1 1 8rem; }
  .track-header input { padding:8px 10px; font-size:16px; background:#0e1013; color:var(--fg);
    border:1px solid var(--line); border-radius:4px; min-width:0; flex:1 1 8rem; }
  .track-header button { min-height:44px; padding:6px 12px; font-size:13px; background:#2a2f38;
    color:var(--dim); border:1px solid var(--line); border-radius:4px; cursor:pointer; }
  .track-header button:hover { color:var(--fg); border-color:var(--accent); }
  .slot .move-track { flex:0 1 auto; min-width:0; }
  .target { align-items:center; }
  .target label { color:var(--dim); font-size:12px; flex:none; }
  .target select { flex:1 1 8rem; }

  /* Plugin editors. The frame takes the width it is given and the height it
     asks for, within the bounds src/ui/PluginFrame.js allows. */
  .editors { display:flex; flex-direction:column; gap:10px; }
  .editor { background:var(--panel); border:1px solid var(--accent); border-radius:7px; overflow:hidden; }
  .editor header { display:flex; align-items:center; gap:10px; padding:8px 12px; }
  .editor h3 { margin:0; font-size:14px; flex:1; }
  .editor button, .slot .open-editor { min-height:44px; padding:6px 12px; font-size:13px; background:#2a2f38;
    color:var(--fg); border:1px solid var(--line); border-radius:4px; cursor:pointer; }
  /* content-box: the height a frame asks for is for its document, and a
     border counted inside it leaves the document a pixel short and scrolling. */
  .plugin-frame { display:block; box-sizing:content-box; width:100%; border:0;
    border-top:1px solid var(--line); background:var(--panel); }

  /* Arrangement. The lanes scroll inside their own box, never the page. The
     track names stay put on the left while the lanes scroll under them. */
  .timeline-scroll { position:relative; overflow-x:auto; border:1px solid var(--line); border-radius:7px;
    background:#13161b; padding-bottom:6px; }
  /* Where the transport is, in the timeline and the piano roll. Drawn over,
     never in the way of a press. */
  .playhead { position:absolute; top:0; bottom:0; width:2px; background:#ffd166; z-index:3; pointer-events:none; }
  .piano-roll .playhead { left:calc(var(--key) + var(--cell) * var(--at)); }
  .timeline-scroll:focus-visible { outline:2px solid #7fb3ff; outline-offset:2px; }
  .timeline-ruler { position:relative; height:22px; margin-left:var(--head); color:var(--dim); font-size:11px; }
  .clip-colors { display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
  .clip-colors button { min-width:44px; min-height:44px; padding:0; border:1px solid var(--line, #3a4150); border-radius:6px; background:#2a2f38; color:var(--fg); font:inherit; }
  button[data-icon] { min-width:44px; min-height:44px; padding:0 10px; display:inline-flex; align-items:center; justify-content:center; }
  button[data-icon] .icon { display:block; }
  #carry { display:flex; flex-wrap:wrap; align-items:center; gap:12px; padding:12px 16px; margin:8px 0; background:#1d2a3d; border:2px solid var(--accent); border-radius:12px; }
  #carry[hidden] { display:none; }
  #carry-text { flex:1 1 14rem; }
  #carry button { min-height:44px; padding:0 14px; background:#2a2f38; color:var(--fg); border:1px solid var(--line); border-radius:6px; font:inherit; }
  .clip-actions { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:6px; }
  .clip-actions button { min-height:44px; min-width:44px; padding:0 12px; background:#2a2f38; color:var(--fg); border:1px solid var(--line, #3a4150); border-radius:6px; font:inherit; }
  .timeline-tools { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:6px; }
  .timeline-tools button { min-height:44px; min-width:44px; padding:0 12px; background:#2a2f38; color:var(--fg);
                           border:1px solid var(--line); border-radius:6px; }
  .timeline-tools select { min-height:44px; font-size:16px; background:#2a2f38; color:var(--fg);
                           border:1px solid var(--line); border-radius:6px; }
  .timeline-zoom { color:var(--dim); font-size:13px; min-width:5.5em; }
  .timeline .empty { display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:14px; margin-left:var(--head); }
  .timeline .empty p { flex:1 1 100%; margin:0; color:var(--dim); }
  .timeline .empty button { min-height:44px; padding:0 14px; background:#2a2f38; color:var(--fg);
    border:1px solid var(--line); border-radius:6px; cursor:pointer; }
  /* The chain under a lane stays in view as the lanes scroll, and wraps inside what is visible. */
  .timeline-chain { position:sticky; left:var(--head); margin-left:var(--head); width:calc(var(--view, 100vw) - var(--head) - 16px); box-sizing:border-box;
    padding:4px 8px 8px; }
  .timeline-chain[hidden], .timeline[data-routing="off"] .timeline-chain, .timeline-row[data-size="small"] .timeline-chain { display:none; }
  .chain-list { list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:8px; }
  .chain-item { display:flex; flex-direction:column; gap:2px; min-width:8rem; max-width:16rem; padding:4px 6px;
    border:1px solid var(--line); border-radius:6px; background:#161a20; }
  .chain-item.failed { border-style:dashed; border-color:var(--err); }
  .master-row { margin-top:8px; padding:6px 0; border-top:2px solid var(--line); }
  .master-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:0 8px 6px; }
  .master-title { font-weight:600; }
  .master-head button { min-height:44px; padding:0 12px; background:#2a2f38; color:var(--fg); border:1px solid var(--line); border-radius:6px; font:inherit; }
  .master-head select { min-height:44px; font-size:16px; background:#2a2f38; color:var(--fg); border:1px solid var(--line); border-radius:6px; }
  .envelope-lanes { margin:6px 0 0; display:flex; flex-direction:column; gap:6px; }
  .envelope-lane { border:1px solid var(--line); border-radius:6px; background:#151922; }
  .envelope-head { display:flex; align-items:center; gap:8px; padding:4px 8px; font-size:13px; color:var(--dim); }
  .envelope-title { flex:1 1 auto; }
  .envelope-add, .envelope-remove { min-height:44px; min-width:44px; padding:0 10px; background:#2a2f38; color:var(--fg);
    border:1px solid var(--line); border-radius:6px; font:inherit; display:inline-flex; align-items:center; justify-content:center; }
  .envelope-body { position:relative; background-image:linear-gradient(to right, #ffffff10 1px, transparent 1px); background-size:96px 100%; cursor:crosshair; }
  .envelope-line { position:absolute; left:0; top:0; pointer-events:none; }

  .send-level { display:inline-flex; align-items:center; gap:6px; }
  .send-level input { min-height:44px; width:8rem; }
  .send-row select, .send-add select { min-height:44px; font-size:16px; background:#0e1116; color:var(--fg); border:1px solid var(--line); border-radius:6px; }
  .send-row button, .send-add button { min-height:44px; padding:0 14px; background:#2a2f38; color:var(--fg); border:1px solid var(--line); border-radius:6px; cursor:pointer; }
  .master-channel { border-color:var(--accent); }
  .align { margin:0 0 10px; }

  .timeline-loop { position:relative; height:44px; margin-left:var(--head); cursor:crosshair; touch-action:none; }
  .loop-brace { position:absolute; top:6px; height:32px; box-sizing:border-box; border:1px dashed var(--dim);

  .loop-brace.on { border:2px solid var(--accent); background:rgba(127,179,255,.18); }
  .loop-brace span { display:block; padding:0 6px; font-size:11px; color:var(--dim); overflow:hidden; white-space:nowrap; }
  .loop-brace.on span { color:var(--fg); }
  .loop-handle { position:absolute; top:0; width:44px; height:44px; padding:0; background:transparent; border:0;
    cursor:ew-resize; touch-action:none; }

  .timeline-head span, .timeline-head .show-track { font-size:13px; overflow-wrap:anywhere; }
  .timeline-head .show-track { min-height:44px; text-align:left; background:none; border:0; color:var(--fg);

  .timeline-head[data-size="small"] .head-latency { display:none; }

  .timeline-lane { position:relative; min-height:56px;

  .dock { margin-top:14px; border:1px solid var(--accent); border-radius:7px; background:var(--panel); }
  .dock h2 { margin:0; padding:6px 12px 0; font-size:14px; }
  .dock-splitter { height:44px; cursor:row-resize; border-radius:7px 7px 0 0; touch-action:none;

  .dock-splitter:focus-visible { outline:2px solid #7fb3ff; outline-offset:-2px; }
  .dock-body { overflow:auto; padding:0 12px 12px; }
  .dock-slot[hidden] { display:none; }

  .dock-body.idle { height:auto !important; padding-bottom:12px; }
  .dock-splitter[hidden] { display:none; }

  .audio-field input { min-height:44px; width:8rem; font-size:16px; background:#0e1116; color:var(--fg);
    border:1px solid var(--line); border-radius:6px; padding:0 8px; }
  .audio-panel button, .chain-summary button { min-height:44px; padding:0 14px; background:#2a2f38; color:var(--fg);
    border:1px solid var(--line); border-radius:6px; cursor:pointer; }
  .track-panel { display:flex; flex-direction:column; gap:10px; margin-bottom:12px; }
  .track-field { display:flex; flex-wrap:wrap; align-items:center; gap:8px; font-size:13px; }
  .track-field input, .track-field select { min-height:44px; font-size:16px; background:#0e1116; color:var(--fg);
    border:1px solid var(--line); border-radius:6px; padding:0 8px; }
  .track-field input { width:min(16rem, 100%); }
  .track-colors { display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
  .swatch { width:44px; height:44px; padding:0; border:2px solid var(--line); border-radius:6px; cursor:pointer;

  .swatch[aria-pressed="true"] { border-color:#fff; box-shadow:0 0 0 2px var(--accent); }
  .swatch[aria-pressed="true"]::after { content:'✓'; color:#0b1220; font-weight:700; mix-blend-mode:normal; }
  .track-color-said { font-size:13px; color:var(--dim); }
  .track-actions { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .track-position { font-size:13px; color:var(--dim); margin-right:auto; }
  .track-panel button:not(.swatch) { min-height:44px; padding:0 14px; background:#2a2f38; color:var(--fg);
    border:1px solid var(--line); border-radius:6px; cursor:pointer; }
  .track-panel .danger { border-color:var(--err); }
  .timeline-row { border-left:4px solid var(--track-color, transparent); }
  .timeline-row[data-size="small"] .timeline-lane { min-height:56px; }
  .timeline-row[data-size="large"] .timeline-lane { min-height:320px; }
  .timeline-head[data-size="small"] .head-slider, .timeline-head[data-size="small"] > button:not(.show-track) { display:none; }
  .timeline-head[data-size="small"] .head-mix { flex-wrap:nowrap; }
  .chain-summary ol { margin:6px 0 10px; padding-left:1.4rem; }
  .clip.selected, .timeline-head.selected { outline:2px solid #ffd166; outline-offset:-2px; }
  .piano-roll { margin-top:14px; background:var(--panel); border:1px solid var(--accent); border-radius:7px; padding:10px; }
  .piano-roll header { display:flex; align-items:center; gap:10px; }
  .piano-roll h3 { margin:0; font-size:14px; flex:1; }
  .piano-roll header button { min-height:44px; padding:6px 12px; background:#2a2f38; color:var(--fg);
    border:1px solid var(--line); border-radius:4px; cursor:pointer; }
  .piano-roll-scroll { overflow:auto; max-height:60vh; border:1px solid var(--line); }
  .piano-roll-grid { position:relative; width:max-content; --key:3rem; --cell:28px; }
  .piano-roll-row { display:flex; }
  .piano-roll-row.black .piano-roll-cell { background:#15181d; }
  .piano-roll-key { position:sticky; left:0; z-index:2; width:var(--key); flex:none; font-size:11px; color:var(--dim);
    background:#13161b; border-right:1px solid var(--line); padding:0 4px; display:flex; align-items:center; }
  .piano-roll-cell { width:var(--cell); height:28px; flex:none; border-right:1px solid #1f242b; border-bottom:1px solid #1f242b;
    background:#1a1e24; color:#fff; font-size:12px; line-height:28px; text-align:center; cursor:pointer; }
  .piano-roll-cell.beat { border-left:1px solid var(--line); }
  .piano-roll-cell.on { background:var(--accent); cursor:grab; }
  /* A gap at each end of a note, so notes that touch still read as separate. */
  .piano-roll-cell.on.start { box-shadow:inset 3px 0 0 #0e1013; border-top-left-radius:4px; border-bottom-left-radius:4px; }
  .piano-roll-cell.on.end { box-shadow:inset -3px 0 0 #0e1013; border-top-right-radius:4px; border-bottom-right-radius:4px; }
  .piano-roll-cell.on.start.end { box-shadow:inset 3px 0 0 #0e1013, inset -3px 0 0 #0e1013; }
  /* The last square of a longer note is its handle. */
  .piano-roll-cell.on.end:not(.start) { cursor:ew-resize; }
  .piano-roll-cell.on.selected { background:#6aa6ff; }
  /* The bar past the end of the clip: drawing into it makes the clip longer. */
  .piano-roll-cell.beyond { opacity:.5; }
  .piano-roll-cell.cursor { outline:2px solid #ffd166; outline-offset:-2px; }
  .piano-roll-cell:focus-visible { outline:3px solid #ffd166; outline-offset:-3px; }
  @media (pointer: coarse) {
    .piano-roll-grid { --cell:44px; }
    .piano-roll-cell { height:44px; line-height:44px; }

  /* Mixer. One channel below the next, the same orientation a strip already
     has embedded in its track's slot, rather than a side-scrolling console:
     that would need its own narrow-screen redesign, which this does not take
     on. Each channel gets a heading the strip itself does not draw, because
     nothing else on this tab says which track it belongs to. */
  .mixer { display:flex; flex-direction:column; gap:10px; }
  .mixer-channel { background:var(--panel); border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .mixer-channel h3 { margin:0; padding:10px 14px 0; font-size:14px; }
  .mixer-channel .strip { border-bottom:0; }

  /* The generated panel and the knob are in panel.css, shared with the simple page. */
  select { background:#0e1013; color:var(--fg); border:1px solid var(--line); border-radius:4px;
    padding:8px; font-size:16px; min-height:40px; max-width:100%; }

  /* Keyboard */
  /* The keys divide the available width rather than each taking a fixed number
     of pixels. Fixed widths overflowed a phone by 88px: fourteen 30px keys in a
     390px viewport, and max-width could not help because flex children with a
     set width do not shrink. Everything here is a proportion of the container,
     so it fits whatever it is given. */
  .keyboard { position:relative; height:110px; margin-top:10px; user-select:none; touch-action:none;
    width:100%; max-width:520px;
    --white-width: calc(100% / var(--white-count));
    --black-width: calc(100% / var(--white-count) * 0.62); }
  .keys-white { display:flex; height:100%; }
  .key { padding:0; border:0; cursor:pointer; }
  .key-white { flex:1 1 0; min-width:0; height:100%; background:#e8eaed; border:1px solid #9aa1ab;
    border-radius:0 0 4px 4px; }
  .key-white.held { background:var(--accent); }
  .keys-black { position:absolute; top:0; left:0; height:64%; width:100%; }
  .key-black { position:absolute; width:var(--black-width); height:100%; background:#16181d;
    border:1px solid #000; border-radius:0 0 3px 3px; }
  .key-black.held { background:var(--accent); }

  /* Log */
  details.log { border-top:1px solid var(--line); padding:8px 14px; background:#13161b; }
  details.log summary { cursor:pointer; color:var(--dim); font-size:12px; }
  #log { font-family:ui-monospace,monospace; font-size:11px; max-height:28vh; overflow:auto; margin-top:8px; }
  .log-line { padding:2px 0; border-bottom:1px solid #1b1f26; overflow-wrap:anywhere; }
  .log-ok { color:var(--ok); } .log-error { color:var(--err); }

  /* Local agent. Shares .searchbar's row layout and .log's disclosure look;

  details.agent { border-top:1px solid var(--line); padding:8px 14px; background:#13161b; }
  details.agent summary { cursor:pointer; color:var(--dim); font-size:12px; }
  details.agent .note { margin-top:8px; }
  #agent-log { font-family:ui-monospace,monospace; font-size:11px; max-height:32vh; overflow:auto; margin-top:8px; }
  .agent-step { padding:4px 0; border-bottom:1px solid #1b1f26; overflow-wrap:anywhere; }
  .agent-step .role { color:var(--dim); font-size:10px; margin-right:6px; }
  .agent-step.tool_call .role, .agent-step.tool_result .role { color:var(--accent); }

  @media (max-width: 760px) {
    main { grid-template-columns:minmax(0, 1fr); }
    main.no-browser { grid-template-columns:minmax(0, 1fr); }
    .browser { border-right:0; border-bottom:1px solid var(--line); }

       390px viewport gets four columns of 44px targets. Only the dropdowns
       need the room, and they take the full width rather than two cells. */
    .control-selector { grid-column:1 / -1; }
    .control-asset { grid-column:1 / -1; }
    .links { margin-left:0; }
    /* Wrapped onto several rows the bar is a third of a phone's height, so it scrolls away
       with the page rather than staying put. */
    .transport { position:static; }
    /* Four tabs must fit a phone's width without the page scrolling sideways. */
    .tab { padding:10px 10px; }
    /* The lanes get the width: a narrower header, and the empty state uses all of it. */
    .timeline { --head:10.5rem; }
    .timeline .empty { margin-left:0; }
    .timeline-head { padding:4px 6px; }
    .head-slider { grid-template-columns:2.2rem 1fr 3.2rem; }

  @media (prefers-reduced-motion: reduce) { * { transition-duration:0.01ms !important; } }


/* web/panel.css
   The generated control panel and the knob (src/ui/Panel.js, src/ui/Dial.js), shared by the
   studio page and the simple page so the two draw a plugin's controls the same way.
   Expects the colour tokens --line, --accent, --fg and --dim on :root. */
/* Controls.

   A grid of knobs rather than a stack of sliders. A slider needs the width
   of the panel and a knob needs about 50px, which is the difference between
   a 42 control plugin being two thousand pixels of scrolling and being one
   screen. auto-fill, so the number of columns comes from the width the
   panel is given rather than from a count written here. */
.controls { display:grid; gap:12px 8px; align-items:start;
  grid-template-columns:repeat(auto-fill, minmax(84px, 1fr)); }
/* One named section per control group. A fieldset names its controls to
   assistive technology; the legend is the visible section heading. */
.control-group { border:1px solid var(--line); border-radius:7px;
  padding:10px 12px 12px; margin:0 0 12px; min-width:0; }
.control-group:last-child { margin-bottom:0; }
.control-group legend { font-size:12px; color:var(--dim); padding:0 6px; }
.control { display:flex; flex-direction:column; align-items:center; gap:4px; min-width:0; }
.control label { color:var(--dim); font-size:11px; line-height:1.25; text-align:center;
  overflow-wrap:anywhere; }
.control .value { font-family:ui-monospace,monospace; font-size:11px; text-align:center; }
/* A dropdown cannot be read at 84px, so it takes two cells and its own
   control stretches to fill them. */
.control-selector { grid-column:span 2; }
.control-selector select { width:100%; }
/* A file input is wider than 84px lets on and left-aligned reads more like
   a form field than a knob, the same reasoning behind a selector's own
   two-cell span. */
.control-asset { grid-column:span 2; align-items:flex-start; }
.control-asset input[type=file] { width:100%; max-width:100%; font-size:16px; color:var(--dim); }

/* The knob. The input is still the control: it is laid over the face,
   invisible, and keeps the role, the value and every key. pointer-events
   are off it so a drag reaches .dial, which turns vertical movement into
   input events; Dial.js explains why that is not the native behaviour. */
.dial { position:relative; width:52px; height:52px; touch-action:none; cursor:ns-resize;
  border-radius:50%; }
/* 2.4.7 wants the focus visible, and the input it belongs to is invisible,
   so the ring goes on the wrapper. */
.dial:focus-within { outline:2px solid #7fb3ff; outline-offset:3px; }
.dial-face { display:block; width:100%; height:100%; }
.dial-track { stroke:var(--line); stroke-width:9; stroke-linecap:round; }
.dial-value { stroke:var(--accent); stroke-width:9; stroke-linecap:round; }
.dial-pointer { stroke:var(--fg); stroke-width:6; stroke-linecap:round; }
/* Not display:none and not visibility:hidden: either takes it out of the
   tab order, which is the whole thing this is trying not to lose. It keeps
   its size so a pointer that does reach it lands where the knob is. */
.dial-input { position:absolute; inset:0; width:100%; height:100%; margin:0;
  opacity:0; pointer-events:none; }

/* :not, because input[type=range] is a more specific selector than
   .dial-input and would otherwise give the knob's hidden input a 40px box
   inside a 52px knob. Invisible today, since it is out of flow and takes no
   pointer events, and exactly the kind of thing that is not invisible the
   day one of those changes. */
input[type=range]:not(.dial-input) { width:100%; min-width:0; height:40px; }
input[type=checkbox] { width:22px; height:22px; }
/* A touch target is 44px (CLAUDE.md): on a phone the generated switches and triggers are that size. */
@media (max-width: 720px) { input[type=checkbox] { width:44px; height:44px; } }
</style>
